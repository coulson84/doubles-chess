<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Doubles</title>
    <link href="/app.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">
    <div class="container mx-auto p-4">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-amber-400 mb-2">Chess Doubles</h1>
            <div id="status" class="inline-block p-3 rounded-lg transition-colors duration-200">
                <span class="font-medium">Disconnected</span>
            </div>
        </header>

        <!-- Game Controls -->
        <div class="flex justify-center space-x-4 mb-8">
            <button onclick="connectWebSocket()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors duration-200">
                Connect
            </button>
            <button onclick="testAPI()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg transition-colors duration-200">
                Test API
            </button>
            <button onclick="sendMessage()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg transition-colors duration-200">
                Send Message
            </button>
        </div>

        <!-- Chess Boards Container -->
        <div class="flex flex-col xl:flex-row xl:space-x-8 space-y-8 xl:space-y-0 justify-center items-center xl:items-start">
            <!-- Board 1 -->
            <div class="flex flex-col items-center">
                <h2 class="text-xl font-semibold text-amber-300 mb-4">Board 1</h2>
                <div class="bg-amber-100 p-4 rounded-lg shadow-2xl">
                    <!-- Rank labels (left side) -->
                    <div class="flex">
                        <div class="flex flex-col justify-center mr-2">
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">8</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">7</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">6</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">5</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">4</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">3</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">2</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">1</div>
                        </div>
                        <div>
                            <div id="board1" class="grid grid-cols-8 gap-0 border-2 border-amber-800">
                                <!-- Chess squares will be generated by JavaScript -->
                            </div>
                            <!-- File labels (bottom) -->
                            <div class="flex mt-1">
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">a</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">b</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">c</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">d</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">e</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">f</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">g</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">h</div>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between mt-4 text-amber-800 font-semibold">
                        <span>Player 1 & 3</span>
                        <span>vs</span>
                        <span>Player 2 & 4</span>
                    </div>
                </div>
            </div>

            <!-- Board 2 -->
            <div class="flex flex-col items-center">
                <h2 class="text-xl font-semibold text-amber-300 mb-4">Board 2</h2>
                <div class="bg-amber-100 p-4 rounded-lg shadow-2xl">
                    <!-- Rank labels (left side) -->
                    <div class="flex">
                        <div class="flex flex-col justify-center mr-2">
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">8</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">7</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">6</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">5</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">4</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">3</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">2</div>
                            <div class="w-6 h-12 flex items-center justify-center text-amber-800 font-bold text-sm">1</div>
                        </div>
                        <div>
                            <div id="board2" class="grid grid-cols-8 gap-0 border-2 border-amber-800">
                                <!-- Chess squares will be generated by JavaScript -->
                            </div>
                            <!-- File labels (bottom) -->
                            <div class="flex mt-1">
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">a</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">b</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">c</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">d</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">e</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">f</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">g</div>
                                <div class="w-12 h-6 flex items-center justify-center text-amber-800 font-bold text-sm">h</div>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between mt-4 text-amber-800 font-semibold">
                        <span>Player 1 & 3</span>
                        <span>vs</span>
                        <span>Player 2 & 4</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Info and Messages -->
        <div class="mt-12 max-w-4xl mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Game Status -->
                <div class="bg-slate-800 rounded-lg p-6">
                    <h3 class="text-lg font-semibold text-amber-300 mb-4">Game Status</h3>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span>Current Turn:</span>
                            <span class="text-amber-300">White</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Active Board:</span>
                            <span class="text-amber-300">Board 1</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Move Count:</span>
                            <span class="text-amber-300">0</span>
                        </div>
                    </div>
                </div>

                <!-- Messages -->
                <div class="bg-slate-800 rounded-lg p-6">
                    <h3 class="text-lg font-semibold text-amber-300 mb-4">Messages</h3>
                    <div id="messages" class="bg-slate-700 rounded-lg p-4 h-48 overflow-y-auto">
                        <!-- Messages will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
