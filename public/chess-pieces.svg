<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- King -->
  <symbol id="chess-king" viewBox="0 0 45 45">
    <g class="chess-piece">
      <rect x="20" y="8" width="5" height="5" fill="currentColor"/>
      <rect x="21.5" y="3" width="2" height="5" fill="currentColor"/>
      <ellipse cx="22.5" cy="18" rx="8" ry="10" fill="currentColor"/>
      <rect x="15" y="28" width="15" height="8" rx="4" fill="currentColor"/>
      <rect x="17" y="36" width="11" height="5" rx="2.5" fill="currentColor"/>
    </g>
  </symbol>
  <!-- Queen -->
  <symbol id="chess-queen" viewBox="0 0 45 45">
    <g class="chess-piece">
      <circle cx="22.5" cy="10" r="2" fill="currentColor"/>
      <ellipse cx="22.5" cy="18" rx="8" ry="10" fill="currentColor"/>
      <rect x="15" y="28" width="15" height="8" rx="4" fill="currentColor"/>
      <rect x="17" y="36" width="11" height="5" rx="2.5" fill="currentColor"/>
      <circle cx="16" cy="12" r="2" fill="currentColor"/>
      <circle cx="29" cy="12" r="2" fill="currentColor"/>
    </g>
  </symbol>
  <!-- Rook -->
  <symbol id="chess-rook" viewBox="0 0 45 45">
    <g class="chess-piece">
      <rect x="15" y="10" width="15" height="25" rx="2" fill="currentColor"/>
      <rect x="15" y="35" width="15" height="5" rx="2.5" fill="currentColor"/>
      <rect x="17" y="5" width="3" height="5" fill="currentColor"/>
      <rect x="25" y="5" width="3" height="5" fill="currentColor"/>
    </g>
  </symbol>
  <!-- Bishop -->
  <symbol id="chess-bishop" viewBox="0 0 45 45">
    <g class="chess-piece">
      <ellipse cx="22.5" cy="18" rx="7" ry="10" fill="currentColor"/>
      <rect x="18" y="28" width="9" height="8" rx="4.5" fill="currentColor"/>
      <rect x="19.5" y="10" width="6" height="5" rx="3" fill="currentColor"/>
      <circle cx="22.5" cy="10" r="2" fill="#fff"/>
    </g>
  </symbol>
  <!-- Knight -->
  <symbol id="chess-knight" viewBox="0 0 45 45">
    <g class="chess-piece">
      <path d="M30 35c-2-10-10-15-10-20 0-5 8-5 10 0" fill="currentColor"/>
      <rect x="15" y="35" width="15" height="5" rx="2.5" fill="currentColor"/>
      <ellipse cx="27" cy="18" rx="2" ry="1.5" fill="#fff"/>
      <path d="M20 20 Q18 15 25 15" stroke="#fff" stroke-width="1" fill="none"/>
    </g>
  </symbol>
  <!-- Pawn -->
  <symbol id="chess-pawn" viewBox="0 0 45 45">
    <g class="chess-piece">
      <circle cx="22.5" cy="15" r="4" fill="currentColor"/>
      <ellipse cx="22.5" cy="23" rx="6" ry="8" fill="currentColor"/>
      <rect x="17.5" y="31" width="10" height="7" rx="5" fill="currentColor"/>
    </g>
  </symbol>
</svg>
