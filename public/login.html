<head>
  <title>dc-login</title>
</head>

<body>
  <!-- Authentication Section -->
  <div id="auth-section" class="mb-8">
    <!-- Login Section (shown when not authenticated) -->
    <div
      id="login-section"
      class="bg-slate-800 rounded-lg p-6 max-w-md mx-auto"
    >
      <h2 class="text-xl font-semibold text-amber-300 mb-4 text-center">
        Sign In to Play
      </h2>
      <p class="text-gray-300 text-sm mb-6 text-center">
        Choose your preferred sign-in method to start playing Chess Doubles
      </p>

      <div class="space-y-3">
        <!-- Google Login -->
        <button
          id="google-login-btn"
          class="w-full flex items-center justify-center px-6 py-3 bg-white text-gray-800 rounded-lg hover:bg-gray-100 transition-colors duration-200 font-medium"
        >
          <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Continue with Google
        </button>

        <!-- Email/Username Login -->
        <button
          id="login-form-btn"
          class="w-full flex items-center justify-center px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200 font-medium"
        >
          <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 12.017c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
          </svg>
          Login with Email
        </button>

        <!-- Register -->
        <button
          id="register-form-btn"
          class="w-full flex items-center justify-center px-6 py-3 bg-gray-800 text-white rounded-lg hover:bg-gray-900 transition-colors duration-200 font-medium"
        >
          <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          Register Account
        </button>
      </div>
    </div>

    <!-- User Profile Section (shown when authenticated) -->
    <div
      id="user-section"
      class="bg-slate-800 rounded-lg p-6 max-w-md mx-auto hidden"
    >
      <div class="flex items-center space-x-4 mb-4">
        <img
          id="user-avatar"
          src=""
          alt="User Avatar"
          class="w-12 h-12 rounded-full"
        />
        <div>
          <h3 id="user-name" class="text-lg font-semibold text-amber-300"></h3>
          <p id="user-email" class="text-sm text-gray-400"></p>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-4 text-center mb-4">
        <div>
          <div id="user-games" class="text-xl font-bold text-amber-300">0</div>
          <div class="text-xs text-gray-400">Games</div>
        </div>
        <div>
          <div id="user-wins" class="text-xl font-bold text-green-400">0</div>
          <div class="text-xs text-gray-400">Wins</div>
        </div>
        <div>
          <div id="user-rating" class="text-xl font-bold text-blue-400">
            1200
          </div>
          <div class="text-xs text-gray-400">Rating</div>
        </div>
      </div>
      <button
        id="logout-btn"
        class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors duration-200"
      >
        Sign Out
      </button>
    </div>
  </div>
  <style>
    :host {
      width: 100px;
    }
  </style>

  <script></script>
</body>
